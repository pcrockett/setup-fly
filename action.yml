# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: 'Setup Flyctl'
description: 'Installs flyctl in your GitHub workflows'
inputs:
  version:
    description: 'Version to install, ex: 0.4.61'
    default: 'FIXME'
  checksum:
    description: 'SHA256 checksum of download artifact'
    default: 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2'

runs:
  using: "composite"
  steps:
    - id: cache
      name: Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/setup-fly
        key: setup-fly-1|${{ inputs.version }}|${{ inputs.checksum }}

    - name: Download flyctl
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CHECKSUM: ${{ inputs.checksum }}
      run: |
        mkdir -p ~/.cache/setup-fly
        "${GITHUB_ACTION_PATH}/download-artifact.sh" \
          "https://github.com/superfly/flyctl/releases/download/v${VERSION}/flyctl_${VERSION}_Linux_x86_64.tar.gz" \
          ~/.cache/setup-fly/artifact.tar.gz \
          "${CHECKSUM}"

    - name: Install flyctl
      shell: bash
      run: |
        install_dir=~/.local/bin
        mkdir -p "${install_dir}"
        cd ~/.cache/setup-fly
        tar -xzf artifact.tar.gz
        chmod +x flyctl
        mv flyctl "${install_dir}"
        echo "${install_dir}" >>"${GITHUB_PATH}"
